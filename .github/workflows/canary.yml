name: canary

# Runs the published actions (`@v1`, crustyimg `latest`) on every OS once a
# week, so a broken crustyimg release or action tag shows up within days
# instead of when someone's CI breaks.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # A canary that only ever passes proves nothing. First show the action
      # still FAILS on a known-bad image (a photo with GPS location in it).
      - name: Known-bad image must fail
        id: bad
        continue-on-error: true
        uses: jysf/crustyimg-action@v1
        with:
          paths: canary/**/*

      - name: Assert it failed and found the GPS leak
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.bad.outcome }}" = "failure" ] || { echo "expected a failure, got '${{ steps.bad.outcome }}'"; exit 1; }
          jq -e '[.findings[] | select(.rule == "privacy/gps-metadata-leak") | .file] == ["canary/gps-leak.jpg"]' \
            "$RUNNER_TEMP/crustyimg-lint.json"

      # Then the real site must pass.
      - name: The site's images pass
        uses: jysf/crustyimg-action@v1
        with:
          paths: assets/**/*
