name: site

# Builds the site's images with `crustyimg build` (see crustyimg.build.toml
# and the recipes in recipes/) and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jysf/setup-crustyimg@v1

      - name: Build the images
        run: |
          set -euo pipefail
          crustyimg build
          # The guests folder may hold no photos yet (only .gitkeep), and a
          # build target with nothing to match stops the build.
          if [ -n "$(find assets/photos/guests -maxdepth 1 -type f ! -name .gitkeep)" ]; then
            crustyimg build guests.build.toml
          fi

      - name: Assemble the site
        run: |
          set -euo pipefail
          cp index.html style.css site.js _site/
          ./scripts/record-modern-formats.sh
          {
            echo "### Photo sizes"
            echo ""
            echo "Each photo is served in the format crustyimg picked, with a JPEG fallback."
            echo ""
            echo '| Photo | Source | JPEG fallback | Served | Format |'
            echo '|---|---|---|---|---|'
            kb() { echo "$(( ($(wc -c < "$1") + 512) / 1024 )) KB"; }
            # One line per photo: its folder, source file, and modern file
            # (or "-" when there is only the JPEG).
            jq -r '(.hero | ["assets/photos", .file, (.modern // "-")]), (.gallery[] | ["assets/photos", .file, (.modern // "-")]), (.guests[] | ["assets/photos/guests", .file, (.modern // "-")]) | join(" ")' _site/photos.json > "$RUNNER_TEMP/photos.txt"
            while read -r dir file modern; do
              fallback="_site/${dir}/${file%.*}.jpg"
              served="$fallback"; [ "$modern" != "-" ] && served="_site/${dir}/${modern}"
              name="${dir}/${file}"
              echo "| ${name#assets/photos/} | $(kb "${dir}/${file}") | $(kb "$fallback") | $(kb "$served") | ${served##*.} |"
            done < "$RUNNER_TEMP/photos.txt"
            echo "| social-card.jpg (link previews) | | | $(kb _site/social-card.jpg) | jpg |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
